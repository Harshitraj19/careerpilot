<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page('Company prep hub', ~{::#page}, 'student-prep')}">
<body>
<div id="page">
<div class="page-head">
    <div><h1>Company prep hub</h1><div class="sub">Round pattern, selection trends, what seniors were asked, and an AI summary.</div></div>
    <form class="d-flex gap-2" id="prep-form">
        <input class="form-control" id="company" list="company-list" placeholder="Company name" required style="min-width:240px">
        <datalist id="company-list"></datalist>
        <button class="btn btn-primary" type="submit">Open</button>
    </form>
</div>
<div id="hub"><div class="card"><div class="card-body"><div class="empty"><i class="bi bi-building"></i>Choose a company to see its prep hub.</div></div></div></div>
<div class="card mt-3"><div class="card-header">Practice interview questions <span class="badge text-bg-light">AI</span></div><div class="card-body">
    <form class="row g-2 align-items-end" id="iq-form">
        <div class="col-md-4"><label class="form-label small">Role</label><input class="form-control" name="role" required value="Software Engineer"></div>
        <div class="col-md-5"><label class="form-label small">Skills</label><input class="form-control" name="skills" data-list placeholder="Java, SQL"></div>
        <div class="col-md-1"><label class="form-label small">Count</label><input class="form-control" type="number" name="count" value="8" min="3" max="20"></div>
        <div class="col-md-2"><button class="btn btn-outline-primary w-100" type="submit">Generate</button></div>
    </form>
    <div id="iq-list" class="mt-3"></div>
</div></div>
</div>
</body>
</html>
