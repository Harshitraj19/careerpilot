<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page('Job openings', ~{::#page}, 'student-jobs')}">
<body>
<div id="page">
<div class="page-head">
    <div><h1>Job openings</h1><div class="sub">Eligibility and your skill match are checked for every drive. <span id="job-count"></span></div></div>
    <div class="d-flex flex-wrap gap-2">
        <input class="form-control" id="job-search" placeholder="Search company, role or skill" style="min-width:240px;width:auto">
        <select class="form-select" id="job-type" style="width:auto">
            <option value="">All types</option><option value="FULL_TIME">Full-time (FTE)</option><option value="INTERNSHIP">Internships</option>
            <option value="INTERNSHIP_WITH_PPO">Internship + PPO</option>
        </select>
        <select class="form-select" id="job-filter" style="width:auto">
            <option value="">All open</option><option value="eligible">Eligible only</option><option value="applied">Applied</option>
        </select>
    </div>
</div>
<div class="row g-3" id="job-list"></div>
</div>
</body>
</html>
