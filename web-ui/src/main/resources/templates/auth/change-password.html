<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/auth :: auth('Change password', ~{::#page})}">
<body>
<div id="page">
    <div class="card auth-card">
        <div class="card-body p-4">
            <h2 class="h5 fw-bold">Change your password</h2>
            <div th:if="${forced}" class="alert alert-warning py-2 small">
                <i class="bi bi-exclamation-triangle"></i> You are using a temporary password. Choose your own password to continue.
            </div>
            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
            <form th:action="@{/account/change-password}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="currentPassword">Current (or temporary) password</label>
                    <input class="form-control" type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password">
                </div>
                <th:block th:fragment="newPasswordFields">
                    <div class="mb-2">
                        <label class="form-label small fw-semibold" for="newPassword">New password</label>
                        <div class="input-group">
                            <input class="form-control" type="password" id="newPassword" name="newPassword" required minlength="8" autocomplete="new-password" data-strength="#pw-strength">
                            <button class="btn btn-outline-secondary" type="button" data-toggle-password="#newPassword" aria-label="Show password"><i class="bi bi-eye"></i></button>
                        </div>
                        <div class="progress mt-2" style="height:.35rem"><div class="progress-bar" id="pw-strength" style="width:0"></div></div>
                        <div class="form-text">At least 8 characters with upper and lower case letters, a digit and a symbol.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" for="confirmPassword">Confirm new password</label>
                        <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
                    </div>
                </th:block>
                <button class="btn btn-primary w-100" type="submit">Save password</button>
            </form>
            <div class="text-center mt-3 small" th:if="${!forced}"><a th:href="@{/}">Cancel</a></div>
            <form th:if="${forced}" th:action="@{/logout}" method="post" class="text-center mt-3">
                <button class="btn btn-link btn-sm" type="submit">Log out</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
