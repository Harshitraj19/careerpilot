<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/auth :: auth('Forgot password', ~{::#page})}">
<body>
<div id="page">
    <div class="card auth-card">
        <div class="card-body p-4">
            <h2 class="h5 fw-bold">Reset your password</h2>
            <p class="text-muted small">We will e-mail a one-time code to the address registered with your account.</p>
            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="portal">Portal</label>
                    <select class="form-select" id="portal" name="portal">
                        <option value="STUDENT" th:selected="${portal == 'STUDENT'}">Student</option>
                        <option value="COMPANY" th:selected="${portal == 'COMPANY'}">Company</option>
                        <option value="TPO" th:selected="${portal == 'TPO'}">Placement office (TPO)</option>
                        <option value="ADMIN" th:selected="${portal == 'ADMIN'}">Administrator</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="loginId">Login ID (registration no. / e-mail / employee ID / username)</label>
                    <input class="form-control" id="loginId" name="loginId" required autofocus>
                </div>
                <button class="btn btn-primary w-100" type="submit">Send code</button>
            </form>
            <div class="text-center mt-3 small"><a th:href="@{/login(portal=${portal})}">Back to login</a></div>
        </div>
    </div>
</div>
</body>
</html>
