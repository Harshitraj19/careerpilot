<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/auth :: auth('Verify login', ~{::#page})}">
<body>
<div id="page">
    <div class="card auth-card">
        <div class="card-body p-4">
            <div class="text-center mb-3"><i class="bi bi-envelope-check display-5 text-primary"></i></div>
            <h2 class="h5 fw-bold text-center">Two-step verification</h2>
            <p class="text-muted small text-center">We sent a 6-digit code to <strong th:text="${sentTo}">e-mail</strong>. It is valid for a few minutes.</p>
            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
            <form th:action="@{/login/2fa}" method="post">
                <input class="form-control form-control-lg text-center mono mb-3" name="otp" inputmode="numeric" pattern="[0-9]{6}"
                       maxlength="6" placeholder="••••••" required autofocus autocomplete="one-time-code">
                <button class="btn btn-primary btn-lg w-100" type="submit">Verify and continue</button>
            </form>
            <div class="text-center mt-3 small"><a th:href="@{/login}">Back to login</a></div>
        </div>
    </div>
</div>
</body>
</html>
