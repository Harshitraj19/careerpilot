<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/auth :: auth('Set a new password', ~{::#page})}">
<body>
<div id="page">
    <div class="card auth-card">
        <div class="card-body p-4">
            <h2 class="h5 fw-bold">Set a new password</h2>
            <div th:if="${info}" class="alert alert-info py-2 small" th:text="${info}"></div>
            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="portal" th:value="${portal}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="loginId">Login ID</label>
                    <input class="form-control" id="loginId" name="loginId" th:value="${loginId}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="otp">Code from the e-mail</label>
                    <input class="form-control mono" id="otp" name="otp" inputmode="numeric" maxlength="6" required autocomplete="one-time-code">
                </div>
                <div th:replace="~{auth/change-password :: newPasswordFields}"></div>
                <button class="btn btn-primary w-100" type="submit">Change password</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
