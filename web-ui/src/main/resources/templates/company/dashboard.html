<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page('Dashboard', ~{::#page}, 'company-dashboard')}">
<body>
<div id="page">
<div class="page-head">
    <div><h1>Recruiter dashboard</h1><div class="sub">Your drives, funnels and offers at a glance.</div></div>
    <a class="btn btn-primary" th:href="@{/company/jobs/new}"><i class="bi bi-plus-lg me-1"></i>Post a job</a>
</div>
<div class="row g-3 mb-3" id="stats"></div>
<div class="row g-3">
    <div class="col-lg-7"><div class="card h-100"><div class="card-header">Hiring funnel by job</div><div class="card-body"><div style="height:300px"><canvas id="funnel"></canvas></div></div></div></div>
    <div class="col-lg-5"><div class="card h-100"><div class="card-header">Applicants by branch</div><div class="card-body"><div style="height:300px"><canvas id="branches"></canvas></div></div></div></div>
    <div class="col-12"><div class="card"><div class="card-header">Jobs</div><div class="card-body p-0" id="job-table"></div></div></div>
</div>
</div>
</body>
</html>
