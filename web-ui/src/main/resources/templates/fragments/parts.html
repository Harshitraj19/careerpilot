<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* Small shared fragments: <head>, script tags and sidebar links. */-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="ws-url" th:content="${wsUrl}">
    <title th:text="${title} + ' · ' + ${appName}">CareerPilot</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/student.js}"></script>
    <script th:src="@{/js/coding.js}"></script>
    <script th:src="@{/js/exam.js}"></script>
    <script th:src="@{/js/staff.js}"></script>
    <script th:src="@{/js/tpo.js}"></script>
    <script th:src="@{/js/admin.js}"></script>
</th:block>

<a th:fragment="navLink(href, icon, label)" th:href="@{${href}}"
   th:classappend="${#strings.startsWith(currentPath, href) ? 'active' : ''}" class="nav-link">
    <i th:class="'bi bi-' + ${icon}"></i><span th:text="${label}">Label</span>
</a>

</html>
