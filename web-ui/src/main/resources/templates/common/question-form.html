<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page('Coding question', ~{::#page}, 'question-form')}">
<body>
<div id="page">
<input type="hidden" id="question-id" th:value="${questionId}">
<div class="page-head"><div><h1 id="form-title">New coding question</h1></div><button class="btn btn-primary" id="save"><i class="bi bi-check2 me-1"></i>Save</button></div>
<form id="q-form" class="row g-3">
    <div class="col-lg-8"><div class="card"><div class="card-body row g-3">
        <div class="col-md-8"><label class="form-label">Title</label><input class="form-control" name="title" required maxlength="255"></div>
        <div class="col-md-4"><label class="form-label">Difficulty</label><select class="form-select" name="difficulty"><option>EASY</option><option selected>MEDIUM</option><option>HARD</option></select></div>
        <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="8" required></textarea></div>
        <div class="col-md-6"><label class="form-label">Input format</label><textarea class="form-control" name="inputFormat" rows="3"></textarea></div>
        <div class="col-md-6"><label class="form-label">Output format</label><textarea class="form-control" name="outputFormat" rows="3"></textarea></div>
        <div class="col-12"><label class="form-label">Constraints</label><textarea class="form-control" name="constraints" rows="2"></textarea></div>
        <div class="col-md-6"><label class="form-label">Sample input</label><textarea class="form-control mono" name="sampleInput" rows="3"></textarea></div>
        <div class="col-md-6"><label class="form-label">Sample output</label><textarea class="form-control mono" name="sampleOutput" rows="3"></textarea></div>
        <div class="col-12"><label class="form-label">Explanation</label><textarea class="form-control" name="explanation" rows="2"></textarea></div>
    </div></div></div>
    <div class="col-lg-4"><div class="card"><div class="card-body row g-3">
        <div class="col-12"><label class="form-label">Tags</label><input class="form-control" name="tags" data-list placeholder="arrays, dp"></div>
        <div class="col-12"><label class="form-label">Visibility</label><select class="form-select" name="visibility"><option value="PRACTICE">Practice (public)</option><option value="TEST_ONLY">Tests only (private)</option></select></div>
        <div class="col-6"><label class="form-label">Time limit (s)</label><input class="form-control" type="number" step="0.1" name="timeLimit" value="2"></div>
        <div class="col-6"><label class="form-label">Memory (MB)</label><input class="form-control" type="number" name="memoryLimit" value="256"></div>
    </div></div></div>
    <div class="col-12"><div class="card"><div class="card-header d-flex justify-content-between">Test cases
        <button type="button" class="btn btn-sm btn-outline-primary" id="add-tc"><i class="bi bi-plus"></i> Add test case</button></div><div class="card-body" id="testcases"></div></div></div>
</form>
</div>
</body>
</html>
