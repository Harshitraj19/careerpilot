<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page('Test', ~{::#page}, 'test-form')}">
<body>
<div id="page">
<input type="hidden" id="test-id" th:value="${testId}">
<div class="page-head"><div><h1 id="form-title">New test</h1><div class="sub">Each student gets a random selection from the pool, in random order.</div></div>
    <button class="btn btn-primary" id="save"><i class="bi bi-check2 me-1"></i>Save as draft</button></div>
<form id="test-form" class="row g-3">
    <div class="col-lg-7"><div class="card"><div class="card-header">Details</div><div class="card-body row g-3">
        <div class="col-md-8"><label class="form-label">Title</label><input class="form-control" name="title" required maxlength="255"></div>
        <div class="col-md-4"><label class="form-label">Type</label><select class="form-select" name="type"><option>APTITUDE</option><option>CODING</option><option>MIXED</option></select></div>
        <div class="col-12"><label class="form-label">Instructions</label><textarea class="form-control" name="instructions" rows="3" maxlength="2000"></textarea></div>
        <div class="col-md-4"><label class="form-label">Duration (min)</label><input class="form-control" type="number" name="durationMinutes" value="60" min="5" max="600"></div>
        <div class="col-md-4"><label class="form-label">Opens</label><input class="form-control" type="datetime-local" name="windowStart" required></div>
        <div class="col-md-4"><label class="form-label">Closes</label><input class="form-control" type="datetime-local" name="windowEnd" required></div>
        <div class="col-md-4"><label class="form-label">Cut-off %</label><input class="form-control" type="number" step="0.01" name="cutoffPercent" min="0" max="100"></div>
        <div class="col-md-4"><label class="form-label">Linked round ID <span class="small text-muted">(optional)</span></label><input class="form-control" type="number" name="roundId"></div>
        <div class="col-md-4 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" name="randomize" id="randomize" checked><label class="form-check-label" for="randomize">Randomise</label></div></div>
    </div></div>
    <div class="card mt-3"><div class="card-header">MCQ pool</div><div class="card-body row g-3">
        <div class="col-md-4"><label class="form-label">MCQs per student</label><input class="form-control" type="number" name="mcqCount" value="20" min="0" max="200"></div>
        <div class="col-md-4"><label class="form-label">Marks per MCQ</label><input class="form-control" type="number" name="marksPerMcq" value="1" min="1" max="10"></div>
        <div class="col-md-4 d-flex align-items-end"><button type="button" class="btn btn-outline-primary w-100" id="pick-mcqs">Pick from bank</button></div>
        <div class="col-12 small" id="mcq-picked"></div>
    </div></div>
    <div class="card mt-3"><div class="card-header">Coding pool</div><div class="card-body row g-3">
        <div class="col-md-4"><label class="form-label">Coding questions per student</label><input class="form-control" type="number" name="codingCount" value="0" min="0" max="10"></div>
        <div class="col-md-8 d-flex align-items-end"><button type="button" class="btn btn-outline-primary" id="pick-coding">Pick coding questions</button></div>
        <div class="col-12 small" id="coding-picked"></div>
    </div></div></div>
    <div class="col-lg-5"><div class="card"><div class="card-header">Proctoring</div><div class="card-body">
        <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" name="proctored" id="proctored" checked><label class="form-check-label" for="proctored">AI proctoring</label></div>
        <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" name="cameraRequired" id="cameraRequired" checked><label class="form-check-label" for="cameraRequired">Camera required</label></div>
        <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" name="autoSubmitOnViolations" id="autoSubmit" checked><label class="form-check-label" for="autoSubmit">Auto-submit after max warnings</label></div>
        <label class="form-label">Max serious warnings</label><input class="form-control mb-3" type="number" name="maxViolations" value="5" min="1" max="50">
        <label class="form-label">Checks</label><div id="checks" class="row"></div>
    </div></div></div>
</form>
</div>
</body>
</html>
