server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  config:
    import: classpath:placify-common.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/placify_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

placify:
  security:
    public-paths:
      - /api/auth/captcha
      - /api/auth/login
      - /api/auth/login/2fa
      - /api/auth/password/forgot
      - /api/auth/password/reset
      - /api/auth/company/register
      - /api/auth/company/register/otp
      - /api/auth/student/register
      - /api/auth/student/register/otp
  auth:
    jwt-secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtcGxhY2lmeS0yMDI2LWtleQ==}
    token-validity-hours: 12
    session-timeout-minutes: ${SESSION_TIMEOUT_MINUTES:15}
    max-failed-attempts: 5
    lockout-minutes: 15
    otp-validity-minutes: 10
    otp-max-attempts: 5
    otp-resend-cooldown-seconds: 60
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    # Shows generated temporary passwords in API responses. Keep false in production.
    expose-temp-passwords: ${EXPOSE_TEMP_PASSWORDS:false}
    # Demo mode without e-mail: also show one-time codes in the API response. Keep false in production.
    expose-otp: ${EXPOSE_OTP:false}
    # Students may create their own account (verified by an e-mail code) instead of being added by the TPO
    student-self-registration: ${STUDENT_SELF_REGISTRATION:true}
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:Admin@12345}
      email: ${ADMIN_EMAIL:admin@placify.local}
