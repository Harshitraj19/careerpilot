<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">CareerPilot</title>
</head>
<body style="margin:0;padding:0;background:#f5f6f4;font-family:Segoe UI,Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f6f4;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
                <tr>
                    <td style="background:#141414;padding:20px 28px;color:#ffffff;font-size:20px;font-weight:700;">
                        Career<span style="color:#4cc9b8;">Pilot</span>
                        <div style="font-size:12px;font-weight:400;color:#b9bab6;">Navigate Your Future. Own Your Career.</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;">
                        <p style="margin:0 0 6px 0;font-size:14px;color:#6b7280;" th:if="${name}">Hi <span th:text="${name}">Student</span>,</p>
                        <h2 style="margin:0 0 14px 0;font-size:19px;" th:text="${title}">Title</h2>
                        <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;white-space:pre-line;" th:text="${message}">Message</p>
                        <a th:if="${link}" th:href="${link}"
                           style="display:inline-block;background:#2a9d8f;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:14px;">
                            Open in CareerPilot
                        </a>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px;background:#f9fafb;font-size:12px;color:#9ca3af;">
                        This is an automated message from the CareerPilot placement portal. Please do not reply.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
